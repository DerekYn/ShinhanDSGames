<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>공튀기기 - 금융본부 미니 게임대회</title>
<style>
  :root{
    --navy:#0B1F3A;
    --ocean:#123A63;
    --blue:#1B5FA8;
    --sky:#4F9DDE;
    --ice:#BFE2F7;
    --paper:#EAF4FC;
    --accent:#2FBF9E;
    --danger:#E0567A;
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    --font-num: "Segoe UI", "Consolas", "Malgun Gothic", monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{
    margin:0; padding:0; height:100%;
    background: radial-gradient(circle at 20% 0%, #163A63 0%, var(--navy) 55%, #071426 100%);
    font-family: var(--font-ui);
    color: var(--paper);
    overflow:auto;
    touch-action:none;
    user-select:none;
  }
  #app{
    display:flex; flex-direction:column; align-items:center;
    min-height:100vh; padding: 18px; gap:12px;
  }
  .titlebar{ text-align:center; }
  .titlebar h1{
    font-size: clamp(22px, 4vw, 30px);
    margin:0 0 4px; font-weight:700; letter-spacing:-0.02em; color:#fff;
  }
  .titlebar .sub{ font-size:13px; color: var(--ice); opacity:0.75; }

  /* 브랜드 헤더 */
  .brand-bar{
    width:100%;
    max-width: 640px;
    display:flex;
    flex-direction:column;
    gap:10px;
    background: linear-gradient(135deg, rgba(255,255,255,0.09), rgba(255,255,255,0.02));
    border:1px solid rgba(255,255,255,0.16);
    border-radius:16px;
    padding:10px 14px;
    box-sizing:border-box;
  }
  .brand-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    width:100%;
  }
  .brand-left{ display:flex; align-items:center; gap:10px; }
  .brand-logo{ width:32px; height:32px; flex-shrink:0; }
  .brand-logo svg{ width:100%; height:100%; display:block; }
  .brand-text{ display:flex; flex-direction:column; line-height:1.2; }
  .brand-name { 
    font-size: 13px; 
    font-weight: 800; 
    color: #fff; 
    letter-spacing: -0.02em; 
  }
  .brand-dept {
    display: inline-block;
    margin-top: 2px;
    font-size: 10px;
    font-weight: 800;
    color: var(--navy);
    background: var(--sky);
    padding: 2px 8px; /* 좌우 패딩을 살짝 넓혀 뱃지가 꽉 차 보이게 조정 */
    border-radius: 999px;
    width: fit-content;
    letter-spacing: -0.01em;
  }
  .event-tag {
    font-size: 11px;
    font-weight: 700;
    color: var(--ice);
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.2);
    padding: 6px 12px; /* 태그 볼륨감 확대 */
    border-radius: 999px;
    white-space: nowrap;
    letter-spacing: -0.01em;
  }

  /* 게임 바로가기 네비게이션 바 */
  .nav-games{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:6px;
    width:100%;
    overflow-x:auto;
    padding-top:4px;
    border-top:1px solid rgba(255,255,255,0.08);
  }
  .nav-games::-webkit-scrollbar { display:none; }
  .nav-item{
    flex:1;
    min-width:54px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:4px;
    padding:6px 8px;
    border-radius:10px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.12);
    color: var(--ice);
    text-decoration: none;
    font-size: 11px;
    font-weight: 700;
    transition: all 0.15s ease;
    white-space: nowrap;
  }
  .nav-item:hover{
    background: rgba(255,255,255,0.15);
    color: #fff;
    transform: translateY(-1px);
  }
  .nav-item.active{
    background: var(--blue);
    border-color: var(--sky);
    color: #fff;
    box-shadow: 0 0 10px rgba(79, 157, 222, 0.4);
  }

  .player-tag{
    font-size: 12px;
    background: rgba(47, 191, 158, 0.15);
    border: 1px solid var(--accent);
    color: var(--accent);
    padding: 3px 10px;
    border-radius: 20px;
    font-weight: 600;
    display:inline-block;
    margin-top:6px;
  }

  #board-wrap{
    background: linear-gradient(180deg, #0E2A4A, #0A2036);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 18px;
    padding: 10px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.05);
    display:flex; justify-content:center; align-items:center;
    max-width: min(94vw, 640px);
    box-sizing: border-box;
  }
  canvas{
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background:#000;
    border-radius:10px;
    max-width:100%;
    max-height:55dvh;
    border: 1px solid rgba(255,255,255,0.15);
    display: block;
  }

  .hud{ font-size:13px; color:var(--ice); opacity:0.8; text-align:center; }
  .hud kbd{
    background: #061424; border:1px solid rgba(255,255,255,0.2);
    padding:1px 6px; border-radius:4px; font-family:var(--font-num); color:var(--sky);
  }

  .controls{ display:flex; gap:12px; }
  .controls button{
    font-size:18px; padding:12px 24px; border-radius:12px;
    background: var(--ocean); color:#fff; border:1px solid rgba(255,255,255,0.2);
    cursor:pointer; transition:background 0.1s ease, transform 0.1s ease;
  }
  .controls button:active{ background:var(--blue); transform:scale(0.96); }

  button.main{
    font-family: var(--font-ui); font-size:14px; font-weight:600;
    background: var(--blue); color:#fff; border:none;
    padding: 10px 20px; border-radius: 10px; cursor:pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  button.main:hover{ background: var(--sky); }
  button.main:active{ transform: scale(0.97); }
  button.ghost{
    background: transparent; border:1px solid rgba(255,255,255,0.25);
    color: var(--ice); font-family: var(--font-ui); font-size:14px; font-weight:600;
    padding: 10px 20px; border-radius: 10px; cursor:pointer;
    transition: background 0.15s ease;
  }
  button.ghost:hover{ background: rgba(255,255,255,0.08); }

  #overlay, #authOverlay{
    position:fixed; inset:0;
    background: rgba(4,12,24,0.85);
    display:none; align-items:center; justify-content:center; z-index:100;
    padding:20px;
  }
  #overlay.show, #authOverlay.show{ display:flex; }
  .modal{
    background: linear-gradient(180deg, #123A63, #0B1F3A);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 18px;
    padding: 30px 36px;
    text-align:center;
    min-width: 260px;
    max-width: 420px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
  }
  .modal h2{ margin:0 0 8px; font-size:22px; }
  .modal .bigtime{ font-size:36px; font-weight:800; color: var(--accent); margin: 10px 0; font-family: var(--font-num);}
  .modal p{ margin:0 0 18px; color: var(--ice); font-size:14px; line-height:1.6; }

  .auth-input{
    width: 100%; padding: 12px 14px;
    border: 1px solid rgba(255,255,255,0.25); border-radius: 10px;
    background: rgba(255,255,255,0.08); color: #fff; font-size: 16px;
    font-family: var(--font-num); text-align: center; margin-bottom: 16px; outline: none;
  }
  .auth-input:focus{ border-color: var(--sky); background: rgba(255,255,255,0.12); }
  .auth-input.error{ border-color: var(--danger); }
  select.auth-input{
    appearance: none; -webkit-appearance: none; -moz-appearance: none;
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23BFE2F7' stroke-width='2'%3e%3cpath d='M6 9l6 6 6-6'/%3e%3c/svg%3e");
    background-repeat: no-repeat; background-position: right 12px center; background-size: 18px;
    text-align: left; padding-right: 38px; cursor: pointer;
  }
  select.auth-input option{ background: #123A63; color:#fff; }
  .auth-error{ color: var(--danger); font-size: 12px; margin: -10px 0 14px; height: 14px; display: block; }
</style>
</head>
<body>

<!-- 사번/팀 입력 최초 진입 모달 -->
<div id="authOverlay" class="show">
  <div class="modal">
    <h2>⚽ 공튀기기 시작</h2>
    <p>사내 랭킹 집계 및 참여 기록 확인을 위해<br>팀과 사번을 입력해 주세요.</p>
    <select id="teamSelect" class="auth-input">
      <option value="" disabled selected>팀 선택</option>
      <option value="증권개발팀">증권개발팀</option>
      <option value="증권채널팀">증권채널팀</option>
      <option value="카드개발팀">카드개발팀</option>
      <option value="라이프개발팀">라이프개발팀</option>
      <option value="기타">기타</option>
    </select>
    <input type="text" id="sabunInput" class="auth-input" placeholder="사번 입력" maxlength="10">
    <span class="auth-error" id="authError"></span>
    <button class="main" id="authStartBtn" style="width: 100%;">도전 시작</button>
  </div>
</div>

<div id="app">
  <!-- 브랜드 바 (5종 게임 바로가기 탭 내장) -->
  <div class="brand-bar">
    <div class="brand-top">
      <div class="brand-left">
        <div class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#4F9DDE"/>
                <stop offset="1" stop-color="#123A63"/>
              </linearGradient>
            </defs>
            <rect x="1" y="1" width="38" height="38" rx="10" fill="url(#logoGrad)" stroke="rgba(255,255,255,0.25)"/>
            <text x="20" y="27" text-anchor="middle" font-family="Arial, sans-serif" font-weight="800" font-size="18" fill="#fff">SDS</text>
          </svg>
        </div>
		<div class="brand-text">
          <span class="brand-name">신한DS 금융본부</span>
          <span class="brand-dept">3분기 리버스 멘토링</span>
        </div>
      </div>
      <div class="event-tag">🏆 소통 미니게임대회</div>
    </div>
    
    <nav class="nav-games" aria-label="게임 종목 바로가기">
      <a href="https://derekyn.github.io/ShinhanDSGames/ball.html" class="nav-item active">⚽ 공튀기기</a>
      <a href="https://derekyn.github.io/ShinhanDSGames/mole.html" class="nav-item">🐹 두더지</a>
      <a href="https://derekyn.github.io/ShinhanDSGames/apple.html" class="nav-item">🍎 사과</a>
      <a href="https://derekyn.github.io/ShinhanDSGames/bomb.html" class="nav-item">💣 지뢰</a>
      <a href="https://derekyn.github.io/ShinhanDSGames/drop.html" class="nav-item">💧 드롭</a>
    </nav>
  </div>

  <div class="titlebar">
    <h1>⚽ 공튀기기</h1>
    <div class="sub">방향만 조작해 모든 스테이지를 최단 시간 내에 클리어하세요</div>
    <div><span id="playerBadge" class="player-tag" style="display:none;"></span></div>
  </div>

  <div id="board-wrap">
    <canvas id="game" width="640" height="480"></canvas>
  </div>

  <div class="controls">
    <button id="btnLeft" aria-label="Left">◀</button>
    <button id="btnPause" aria-label="Pause">⏸</button>
    <button id="btnRight" aria-label="Right">▶</button>
  </div>
</div>

<div id="overlay">
  <div class="modal">
    <h2 id="ovTitle">알림</h2>
    <div class="bigtime" id="ovTime" style="display:none;">00초</div>
    <p id="ovBody">내용</p>
    <div style="display:flex; gap:10px; justify-content:center;">
      <button class="main" id="btnRestartStage1" style="display:none;">스테이지 1부터 다시</button>
      <button class="ghost" id="btnCloseOverlay">닫기</button>
    </div>
  </div>
</div>

<script>
(function(){
  var GOOGLE_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbyY6mM4y9ltyZhDn7fMCctYajEBye1sxZpQrQ-FcabhllionztMTlJEJMCKCDy_ZxCOMg/exec";
  var GAME_NAME = "공튀기기";

  var currentTeam = "";
  var currentSabun = "";

  function sendLog(eventType, extraData){
    if(!GOOGLE_WEBHOOK_URL) return;
    var payload = Object.assign({
      game: GAME_NAME,
      team: currentTeam,
      sabun: currentSabun,
      event: eventType,
      level: "전체"
    }, extraData || {});

    fetch(GOOGLE_WEBHOOK_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    }).catch(function(err){ console.warn("로그 실패:", err); });
  }

  var level1_base = [
    "RRRRRRRRRRRRRRRRRRRR","R..................R","R.S................R","R..................R",
    "R..................R","R.....RRRRRRR......R","R....RR..RRRR......R","R...RRR.R.RRR......R",
    "R..RRRR.R.RRR......R","R.RRRRR..RRRR......R","RRRRRRRRR...RWWWWWWR","RRRRRRRRR.RRR......R",
    "RRRRRRRRRR.RR......R","RRRRRRRRRRR.R......G","RRRRRRRRR...RRRRRRRR"
  ];
  var level2_base = [
    "RRRRRRRRRRRRRRRRRRRR","R..................R","R.S...RR...........R","R.....R.R..........R",
    "R.....R.R...RRR....R","R.....R.R...R......R","R.....RR.....R.....R","R.............R....R",
    "R...........RRR....R","R..................R","R..................R","RRRRR..............G",
    "RRRRR....RRRR.RRRRRR","RRRRR.RRRRR........R","RRRRR.RRRRR........R"
  ];
  var level3_base = [
    "RRRRRRRRRRRRRRRRRRRR","R..................R","R.S................R","R..................R",
    "R..................R","R..................R","R..................R","R..............JJ..R",
    "R...........J......G","R........J........RR","R.....J............R","R...R..............R",
    "R..R...............R","R..................R","RRRRR..............R"
  ];
  var level4_base = [
    "RRRRRRRRRRRRRRRRRRRR","R..................R","R.S................R","R..................R",
    "R..................R","RRRRRWWWWWRRRRRRRRRR","R...........R......R","R...........R......R",
    "R...........R......R","R...........R......R","R...........R......R","R..................R",
    "R..................G","R....RRRRWWWWJ.RRRRR","R..............RRRRR"
  ];
  var level5_base = [
    "RRRRRRRRRRRRRRRRRRRR","R................S.R","R..................R","R..................R",
    "R.....RRBRRRBRRRRRRR","R................RRR","R................RRR","RBBRRR>..........RRR",
    "R......BBBBBB....RRR","R................RRR","R................RRR","R................RRR",
    "R.....RRRRRRRRRRRR.R","R..................G","R...>..............G"
  ];

  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var W = canvas.width, H = canvas.height;
  var TILE = 16, COLS = Math.floor(W/TILE), ROWS = Math.floor(H/TILE);

  var GRAVITY = 1200, BOUNCE_VY = -420, H_SPEED = 70, ARROW_SPEED = 300;

  var keys = new Set();
  window.addEventListener('keydown', function(e){ keys.add(e.key.toLowerCase()); if(e.key==='p'||e.key==='P') paused = !paused; });
  window.addEventListener('keyup', function(e){ keys.delete(e.key.toLowerCase()); });

  var btnLeft  = document.getElementById('btnLeft');
  var btnRight = document.getElementById('btnRight');
  var btnPause = document.getElementById('btnPause');
  function press(name,on){ if(on) keys.add(name); else keys.delete(name); }
  ['mousedown','touchstart'].forEach(function(ev){
    btnLeft.addEventListener(ev, function(e){ e.preventDefault(); press('touchleft', true); });
    btnRight.addEventListener(ev, function(e){ e.preventDefault(); press('touchright',true); });
  });
  ['mouseup','mouseleave','touchend','touchcancel'].forEach(function(ev){
    btnLeft.addEventListener(ev, function(e){ e.preventDefault(); press('touchleft', false); });
    btnRight.addEventListener(ev, function(e){ e.preventDefault(); press('touchright',false); });
  });
  btnPause.addEventListener('click', function(){ paused = !paused; });

  function pointerSide(e){
    var rect = canvas.getBoundingClientRect();
    var x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    return (x < rect.width/2) ? 'left' : 'right';
  }
  ['touchstart','touchmove'].forEach(function(ev){
    canvas.addEventListener(ev, function(e){
      e.preventDefault();
      var side = pointerSide(e);
      press('touchleft', side==='left');
      press('touchright', side==='right');
    }, {passive:false});
  });
  ['touchend','touchcancel'].forEach(function(ev){
    canvas.addEventListener(ev, function(e){
      e.preventDefault();
      press('touchleft', false); press('touchright', false);
    }, {passive:false});
  });

  var T = { EMPTY:0, RED:1, WHITE:2, GOAL:3, JUMPER:4, BOMB:5, ARROW_LEFT:6, ARROW_RIGHT:7 };

  function upscaleWithSpawn(baseLines, scale){
    scale = scale || 2;
    var spawn = null, out = [];
    for(var r=0; r<baseLines.length; r++){
      var row = baseLines[r], cS = row.indexOf('S');
      if(cS !== -1){ spawn = { x: cS*scale + Math.floor(scale/2), y: r*scale + Math.floor(scale/2) }; }
      var scaledRow = '';
      for(var chIdx=0; chIdx<row.length; chIdx++){
        var ch = row[chIdx];
        scaledRow += (ch==='S'?'.':ch).repeat(scale);
      }
      for(var i=0; i<scale; i++) out.push(scaledRow);
    }
    return { lines: out, spawn: spawn };
  }

  var up1 = upscaleWithSpawn(level1_base, 2), up2 = upscaleWithSpawn(level2_base, 2),
      up3 = upscaleWithSpawn(level3_base, 2), up4 = upscaleWithSpawn(level4_base, 2),
      up5 = upscaleWithSpawn(level5_base, 2);

  function parseLevel(lines){
    var grid = [];
    for(var r=0; r<ROWS; r++){
      grid[r] = [];
      for(var c=0; c<COLS; c++){
        var ch = (lines[r] && lines[r][c]) || '.';
        grid[r][c] = ch==='R'?T.RED : ch==='W'?T.WHITE : ch==='G'?T.GOAL : ch==='J'?T.JUMPER : ch==='B'?T.BOMB : ch==='<'?T.ARROW_LEFT : ch==='>'?T.ARROW_RIGHT : T.EMPTY;
      }
    }
    return grid;
  }

  var levels = [
    { grid: parseLevel(up1.lines), spawn: up1.spawn || {x:6, y:6} },
    { grid: parseLevel(up2.lines), spawn: up2.spawn || {x:6, y:6} },
    { grid: parseLevel(up3.lines), spawn: up3.spawn || {x:3, y:12} },
    { grid: parseLevel(up4.lines), spawn: up4.spawn || {x:4, y:6} },
    { grid: parseLevel(up5.lines), spawn: up5.spawn || {x:2, y:2} }
  ];

  var stage = 0, grid = levels[stage].grid.map(function(r){ return r.slice(); });
  var ball = { x:0, y:0, radius:3, vx:0, vy:0 };
  var last = performance.now(), paused = true;
  var messageTimer = 0, messageText = '', arrowMode = false, arrowDir = 0;
  var startTime = performance.now(), failCount = 0, finalClearShown = false;

  var overlay = document.getElementById('overlay');
  var ovTitle = document.getElementById('ovTitle');
  var ovTime  = document.getElementById('ovTime');
  var ovBody  = document.getElementById('ovBody');
  var btnRestartStage1 = document.getElementById('btnRestartStage1');
  var btnCloseOverlay  = document.getElementById('btnCloseOverlay');

  var authOverlay = document.getElementById('authOverlay');
  var teamSelect = document.getElementById('teamSelect');
  var sabunInput = document.getElementById('sabunInput');
  var authStartBtn = document.getElementById('authStartBtn');
  var playerBadge = document.getElementById('playerBadge');
  var authError = document.getElementById('authError');

  function showOverlay(opt){
    ovTitle.textContent = opt.title;
    ovBody.innerHTML = opt.html;
    btnRestartStage1.style.display = opt.showRestart1 ? 'inline-block' : 'none';
    ovTime.style.display = opt.timeText ? 'block' : 'none';
    if(opt.timeText) ovTime.textContent = opt.timeText;
    overlay.classList.add('show');
    finalClearShown = !!opt.isFinal;
    paused = true;
  }
  function hideOverlay(){ overlay.classList.remove('show'); paused = false; }

  btnCloseOverlay.addEventListener('click', function(){
    if(finalClearShown){
      stage = 0; grid = levels[stage].grid.map(function(r){ return r.slice(); });
      startTime = performance.now(); failCount = 0; applySpawn(); finalClearShown = false;
    }
    hideOverlay();
  });
  btnRestartStage1.addEventListener('click', function(){
    stage = 0; grid = levels[stage].grid.map(function(r){ return r.slice(); });
    startTime = performance.now(); failCount = 0; applySpawn(); finalClearShown = false;
    hideOverlay();
  });

  function applySpawn(){
    var s = levels[stage].spawn || {x:6, y:6};
    ball.x = s.x * TILE + TILE/2; ball.y = s.y * TILE;
    ball.vx = 0; ball.vy = 0; arrowMode = false; arrowDir = 0;
  }
  applySpawn();

  function tileAt(px, py){
    var c = Math.floor(px / TILE), r = Math.floor(py / TILE);
    if(c < 0 || c >= COLS || r < 0) return T.RED;
    if(r >= ROWS) return T.EMPTY;
    return grid[r][c];
  }
  function setTile(c, r, val){ if(r>=0&&c>=0&&r<ROWS&&c<COLS) grid[r][c]=val; }

  function handleInput(){
    if(arrowMode){ ball.vx = arrowDir * ARROW_SPEED; return; }
    var left  = keys.has('arrowleft') || keys.has('a') || keys.has('touchleft');
    var right = keys.has('arrowright')|| keys.has('d') || keys.has('touchright');
    if(left && !right) ball.vx = -H_SPEED;
    else if(right && !left) ball.vx = H_SPEED;
    else ball.vx = 0;
  }

  function physics(dt){
    if(arrowMode){
      ball.vy = 0;
      var newX = ball.x + ball.vx * dt, signX = Math.sign(ball.vx) || 1;
      var probeX = newX + signX * ball.radius;
      if([ball.y - ball.radius + 1, ball.y, ball.y + ball.radius - 1].some(function(y){ return tileAt(probeX,y)===T.RED; })){
        var tileC = Math.floor(probeX / TILE);
        ball.x = signX>0 ? (tileC * TILE - ball.radius - 0.01) : ((tileC+1) * TILE + ball.radius + 0.01);
        arrowMode = false; arrowDir = 0; ball.vx = 0; ball.vy = BOUNCE_VY;
      } else { ball.x = newX; }
      if(ball.y - ball.radius > H + 4){ gameOver(); }
      return;
    }

    ball.vy += GRAVITY * dt;
    var nX = ball.x + ball.vx * dt, sX = Math.sign(ball.vx) || 1, pX = nX + sX * ball.radius;
    if([ball.y - ball.radius + 1, ball.y, ball.y + ball.radius - 1].some(function(y){ return tileAt(pX,y)===T.RED; })){
      var tC = Math.floor(pX / TILE);
      nX = sX>0 ? (tC * TILE - ball.radius - 0.01) : ((tC+1) * TILE + ball.radius + 0.01);
      ball.vx *= -1;
    }
    ball.x = nX;

    var nY = ball.y + ball.vy * dt, sY = Math.sign(ball.vy) || 1, pY = nY + sY * ball.radius;
    var leftX = ball.x - ball.radius + 1, cenX = ball.x, rightX = ball.x + ball.radius - 1;
    var hitRedTop = [tileAt(leftX,pY), tileAt(cenX,pY), tileAt(rightX,pY)].includes(T.RED);

    var hitWhite=false, hitJumper=false, hitBomb=false, arrow=0, whiteCR=null;
    if(ball.vy>0){
      var cIdx = Math.floor(cenX / TILE), rIdx = Math.floor(pY / TILE);
      if(rIdx>=0&&cIdx>=0&&rIdx<ROWS&&cIdx<COLS){
        var t = grid[rIdx][cIdx];
        if(t===T.WHITE){ hitWhite=true; whiteCR=[cIdx,rIdx]; }
        else if(t===T.JUMPER) hitJumper=true;
        else if(t===T.BOMB) hitBomb=true;
        else if(t===T.ARROW_LEFT) arrow=-1;
        else if(t===T.ARROW_RIGHT) arrow=1;
      }
    }

    if(hitRedTop || hitWhite || hitJumper || hitBomb || arrow){
      if(sY>0){
        var tR = Math.floor(pY / TILE);
        nY = tR * TILE - ball.radius - 0.01;
        if(hitBomb){ gameOver(); return; }
        if(arrow){ arrowMode=true; arrowDir=arrow; ball.vx=arrow*ARROW_SPEED; ball.vy=0; ball.y=nY; return; }
        ball.vy = hitJumper ? (BOUNCE_VY * 1.65) : BOUNCE_VY;
        if(hitWhite && whiteCR) setTile(whiteCR[0], whiteCR[1], T.EMPTY);
      } else {
        var tR2 = Math.floor(pY / TILE);
        nY = (tR2+1) * TILE + ball.radius + 0.01;
        ball.vy *= -1;
      }
    }
    ball.y = nY;
    if(ball.y - ball.radius > H + 4){ gameOver(); return; }
    var curC = Math.floor(ball.x / TILE), curR = Math.floor(ball.y / TILE);
    if(grid[curR] && grid[curR][curC] === T.GOAL){ nextStage(); }
  }

  function gameOver(){
    failCount++;
    grid = levels[stage].grid.map(function(r){ return r.slice(); });
    applySpawn();
    showOverlay({ title:'게임 오버', html:'스테이지 ' + (stage+1) + '에서 실패했습니다.<br>다시 도전해보세요!' });
  }

  function nextStage(){
    if(stage === levels.length - 1){
      var elapsed = ((performance.now() - startTime) / 1000).toFixed(1);
      sendLog("종료", {
        score: parseFloat(elapsed),
        detail: "올클리어 (" + elapsed + "초 소요, 실패: " + failCount + "회)"
      });
      showOverlay({
        title:'모든 스테이지 클리어! 🎉',
        timeText: elapsed + '초',
        html:'실패 횟수: <b>' + failCount + '회</b>',
        showRestart1:true, isFinal:true
      });
      return;
    }
    stage++;
    grid = levels[stage].grid.map(function(r){ return r.slice(); });
    applySpawn();
    messageText = 'STAGE CLEAR';
    messageTimer = 1.2;
  }

  function draw(){
    ctx.fillStyle = '#061424';
    ctx.fillRect(0,0,W,H);

    for(var r=0; r<ROWS; r++){
      for(var c=0; c<COLS; c++){
        var t = grid[r][c], x = c*TILE, y = r*TILE;
        if(t===T.EMPTY) continue;
        if(t===T.GOAL){
          ctx.fillStyle = '#0B1F3A'; ctx.fillRect(x, y, TILE, TILE);
          ctx.strokeStyle = '#2FBF9E'; ctx.strokeRect(x+0.5, y+0.5, TILE-1, TILE-1);
        } else if(t===T.RED){
          ctx.fillStyle = '#163A63'; ctx.fillRect(x, y, TILE, TILE);
          ctx.fillStyle = '#1B5FA8'; ctx.fillRect(x+1, y+1, TILE-2, TILE-2);
          ctx.strokeStyle = '#4F9DDE'; ctx.strokeRect(x+0.5, y+0.5, TILE-1, TILE-1);
        } else if(t===T.WHITE){
          ctx.fillStyle = '#334155'; ctx.fillRect(x, y, TILE, TILE);
          ctx.fillStyle = '#94a3b8'; ctx.fillRect(x+1, y+1, TILE-2, TILE-2);
        } else if(t===T.JUMPER){
          ctx.fillStyle = '#065f46'; ctx.fillRect(x+1, y+1, TILE-2, TILE-2);
          ctx.strokeStyle = '#34d399'; ctx.strokeRect(x+0.5, y+0.5, TILE-1, TILE-1);
        } else if(t===T.BOMB){
          ctx.fillStyle = '#1e1b4b'; ctx.fillRect(x, y, TILE, TILE);
          ctx.fillStyle = '#E0567A'; ctx.beginPath(); ctx.arc(x+TILE/2, y+TILE/2, 5, 0, Math.PI*2); ctx.fill();
        } else if(t===T.ARROW_LEFT || t===T.ARROW_RIGHT){
          ctx.fillStyle = '#f59e0b'; ctx.fillRect(x+1, y+1, TILE-2, TILE-2);
          ctx.fillStyle = '#78350f'; ctx.beginPath();
          if(t===T.ARROW_RIGHT){ ctx.moveTo(x+5,y+4); ctx.lineTo(x+11,y+8); ctx.lineTo(x+5,y+12); }
          else { ctx.moveTo(x+11,y+4); ctx.lineTo(x+5,y+8); ctx.lineTo(x+11,y+12); }
          ctx.closePath(); ctx.fill();
        }
      }
    }

    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI*2); ctx.fill();

    ctx.strokeStyle = 'rgba(79,157,222,0.6)';
    ctx.beginPath(); ctx.moveTo(ball.x, ball.y);
    ctx.lineTo(ball.x - ball.vx*0.05, ball.y - ball.vy*0.05); ctx.stroke();

    if(messageTimer>0){
      ctx.fillStyle = 'rgba(11,31,58,0.85)'; ctx.fillRect(0,0,W,24);
      ctx.fillStyle = '#BFE2F7'; ctx.font = '12px monospace'; ctx.textAlign = 'center';
      ctx.fillText(messageText + ' (Stage ' + (stage+1) + ')', W/2, 16);
    }
  }

  function loop(now){
    var dt = Math.min(0.033, (now - last)/1000);
    last = now;
    if(!paused){ handleInput(); physics(dt); if(messageTimer>0) messageTimer -= dt; }
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  function handleAuth(){
    var teamVal = teamSelect.value;
    var val = sabunInput.value.trim();

    if(!teamVal){
      authError.textContent = "팀을 선택해 주세요.";
      teamSelect.classList.add('error'); teamSelect.focus(); return;
    }
    if(!val){
      authError.textContent = "사번을 입력해 주세요.";
      teamSelect.classList.remove('error'); sabunInput.classList.add('error');
      sabunInput.focus(); return;
    }

    // ★ 브라우저 영구 저장 (5개 게임 모두 공유됨)
    localStorage.setItem("sh_mini_team", teamVal);
    localStorage.setItem("sh_mini_sabun", val);

    currentTeam = teamVal;
    currentSabun = val;
    playerBadge.textContent = "플레이어: " + currentTeam + " · " + currentSabun;
    playerBadge.style.display = "inline-block";
    authOverlay.classList.remove('show');
    startGame();
  }

  authStartBtn.addEventListener('click', handleAuth);
  sabunInput.addEventListener('keydown', function(e){ if(e.key === 'Enter') handleAuth(); });
  teamSelect.addEventListener('change', function(){
    teamSelect.classList.remove('error'); authError.textContent = "";
  });

  // ★ 기존 접속 기록 확인 (자동 로그인)
  var savedTeam = localStorage.getItem("sh_mini_team");
  var savedSabun = localStorage.getItem("sh_mini_sabun");

  if(savedTeam && savedSabun){
    currentTeam = savedTeam;
    currentSabun = savedSabun;
    playerBadge.textContent = "플레이어: " + currentTeam + " · " + currentSabun;
    playerBadge.style.display = "inline-block";
    authOverlay.classList.remove('show'); // 팝업 생략
    startGame(); // 즉시 게임 시작
  } else {
    authOverlay.classList.add('show');
    sabunInput.focus();
  }

  // (선택) 사번을 잘못 입력했을 때 배지를 누르면 다시 입력할 수 있는 기능
  playerBadge.style.cursor = "pointer";
  playerBadge.title = "클릭 시 팀/사번 변경";
  playerBadge.addEventListener("click", function(){
    if(confirm("등록된 팀/사번 정보를 변경하시겠습니까?")){
      localStorage.removeItem("sh_mini_team");
      localStorage.removeItem("sh_mini_sabun");
      location.reload();
    }
  });
})();
</script>
