<style>
/* ==========================================
   기본 스타일 & 리셋 (폐쇄망 전용 시스템 폰트)
========================================== */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  background:#090d1a;
  color:#f1f5f9;
  font-family:'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo',sans-serif;
  line-height:1.5;
  padding-bottom:50px;
}
button{font-family:inherit;cursor:pointer;border:none}

/* ==========================================
   상단 헤더 & 브랜드
========================================== */
header{
  background:linear-gradient(180deg,#0d1527 0%,#090d1a 100%);
  border-bottom:1px solid #1e293b;
  padding:16px 16px 12px;
  position:sticky;
  top:0;
  z-index:100;
}
.header-inner{
  max-width:1000px;
  margin:0 auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.brand{display:flex;align-items:center;gap:8px}
.brand-logo{
  font-size:20px;
  font-weight:900;
  letter-spacing:-0.5px;
  color:#0051ff;
  text-shadow:0 0 12px rgba(0,81,255,0.4);
}
.brand-title{
  font-size:13px;
  font-weight:bold;
  color:#94a3b8;
  border-left:1px solid #334155;
  padding-left:8px;
}
.live-badge{
  display:flex;
  align-items:center;
  gap:5px;
  background:#dc2626;
  color:#fff;
  font-size:11px;
  font-weight:bold;
  padding:4px 9px;
  border-radius:12px;
  box-shadow:0 0 10px rgba(220,38,38,0.5);
}
.live-dot{
  width:6px;
  height:6px;
  background:#fff;
  border-radius:50%;
  animation:pulse 1s infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}

/* ==========================================
   라이브 스트리밍 채널 배너
========================================== */
.stream-bar{
  max-width:1000px;
  margin:12px auto 0;
  padding:0 16px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.btn-stream{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:11px 12px;
  border-radius:10px;
  font-weight:bold;
  font-size:13px;
  text-decoration:none;
  transition:transform 0.15s,filter 0.15s;
}
.btn-stream:active{transform:scale(0.97)}
.btn-chzzk{
  background:#00ffa3;
  color:#042116;
  box-shadow:0 3px 12px rgba(0,255,163,0.25);
}
.btn-youtube{
  background:#ff0000;
  color:#ffffff;
  box-shadow:0 3px 12px rgba(255,0,0,0.25);
}

/* ==========================================
   게임 종목 선택 탭 (가로 스크롤)
========================================== */
.game-nav-wrap{
  max-width:1000px;
  margin:14px auto 0;
  padding:0 16px;
  overflow-x:auto;
  scrollbar-width:none;
}
.game-nav-wrap::-webkit-scrollbar{display:none}
.game-nav{
  display:flex;
  gap:8px;
  min-width:max-content;
}
.tab-btn{
  background:#1e293b;
  color:#94a3b8;
  padding:10px 18px;
  border-radius:24px;
  font-size:13px;
  font-weight:bold;
  display:flex;
  align-items:center;
  gap:6px;
  transition:all 0.2s;
  border:1px solid #334155;
}
.tab-btn.active{
  background:#0051ff;
  color:#ffffff;
  border-color:#38bdf8;
  box-shadow:0 4px 14px rgba(0,81,255,0.4);
}

/* ==========================================
   메인 컨텐츠 레이아웃
========================================== */
.container{
  max-width:1000px;
  margin:16px auto 0;
  padding:0 16px;
}
.section-title{
  font-size:16px;
  font-weight:bold;
  color:#f8fafc;
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:12px;
}
.round-selector{
  display:flex;
  gap:6px;
}
.round-btn{
  background:#1e293b;
  color:#94a3b8;
  padding:5px 11px;
  font-size:11px;
  font-weight:bold;
  border-radius:6px;
}
.round-btn.active{
  background:#0284c7;
  color:#fff;
}

/* ==========================================
   매치 카드 & 승부의 신 레이아웃 (모바일 완벽 호환)
========================================== */
.match-list{display:flex;flex-direction:column;gap:14px}
.match-card{
  background:#131d38;
  border:1px solid #1e293b;
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 6px 18px rgba(0,0,0,0.3);
}
.match-header{
  background:#0b1329;
  padding:9px 14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:11px;
  border-bottom:1px solid #1e293b;
}
.match-info{
  color:#38bdf8;
  font-weight:bold;
  display:flex;
  align-items:center;
  gap:6px;
}
.match-status{
  padding:2px 7px;
  border-radius:4px;
  font-weight:bold;
}
.status-live{background:rgba(239,68,68,0.2);color:#f87171;border:1px solid #ef4444}
.status-soon{background:rgba(56,189,248,0.15);color:#38bdf8;border:1px solid #0284c7}
.status-end{background:#334155;color:#94a3b8}

.match-body{
  padding:16px 14px;
}
.teams-grid{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:8px;
}
.team-col{text-align:center}
.team-name{
  font-size:14px;
  font-weight:bold;
  color:#ffffff;
  word-break:keep-all;
}
.team-dept{
  font-size:11px;
  color:#64748b;
  margin-top:2px;
}
.vs-col{
  text-align:center;
  padding:0 4px;
}
.score-badge{
  font-size:18px;
  font-weight:900;
  color:#f8fafc;
  letter-spacing:4px;
  background:#0b1329;
  padding:4px 10px;
  border-radius:8px;
  border:1px solid #334155;
  display:inline-block;
}
.match-time{
  font-size:11px;
  color:#94a3b8;
  margin-top:4px;
}

  border-radius:8px;

  gap:6px;

.quote-item{

}
.quote-tag{

  font-size:10px;

}
.tag-a{background:#1d4ed8;color:#dbeafe}
.tag-b{background:#be123c;color:#ffe4e6}

/* 승부의 신 투표 게이지 & 버튼 */

  margin-top:14px;
  padding-top:12px;
  border-top:1px dashed #1e293b;
}
.pickem-title{
  font-size:11px;
  font-weight:bold;
  color:#38bdf8;
  display:flex;
  justify-content:space-between;
  margin-bottom:6px;
}
.vote-bar-wrap{
  height:12px;
  background:#be123c;
  border-radius:6px;
  overflow:hidden;
  display:flex;
}
.vote-bar-a{
  background:#0051ff;
  height:100%;

.vote-rate-text{

  font-size:11px;
  font-weight:bold;
  margin-top:4px;

.vote-rate-a{color:#60a5fa}
.vote-rate-b{color:#f43f5e}

  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:10px;

.btn-vote{

  border-radius:8px;
  font-size:12px;
  font-weight:bold;

.btn-vote:active{transform:scale(0.96)}
.btn-vote-a{

.btn-vote-b{

.btn-vote.voted{

function getStatusBadge(status){
  if(status === "live") return '<span class="match-status status-live">● 진행중</span>';
  if(status === "soon") return '<span class="match-status status-soon">예정</span>';
  return '<span class="match-status status-end">종료</span>';
}

/* ==========================================================================
   매치 카드 렌더링 (모바일 화면 최우선 반응형 UI)
========================================================================== */
function renderMatches(){
  var game = TOURNAMENT_DATA[currentKey];
  var listEl = document.getElementById("matchList");
  var html = "";

  var filtered = game.matches.filter(function(m){
    if(currentRoundFilter === "all") return true;
    return m.round.indexOf(currentRoundFilter) !== -1;
  });

  if(filtered.length === 0){
    listEl.innerHTML = '<div style="text-align:center;padding:40px;color:#64748b;font-size:13px">해당 라운드의 경기 일정이 없습니다.</div>';
    return;
  }

  filtered.forEach(function(m){
    var totalVotes = m.votesA + m.votesB;
    var rateA = totalVotes === 0 ? 50 : Math.round((m.votesA / totalVotes) * 100);
    var rateB = 100 - rateA;

    var myVote = userVotes[m.id];
    var votedAClass = myVote === "A" ? " voted" : "";
    var votedBClass = myVote === "B" ? " voted" : "";

    html += '<div class="match-card">'
      + '<div class="match-header">'
      + '  <div class="match-info"><span>🏆</span>' + m.round + '</div>'
      +    getStatusBadge(m.status)
      + '</div>'
      + '<div class="match-body">'
      + '  <div class="teams-grid">'
      + '    <div class="team-col">'
      + '      <div class="team-name">' + m.teamA + '</div>'
      + '      <div class="team-dept">' + m.deptA + '</div>'
      + '    </div>'
      + '    <div class="vs-col">'
      + '      <div class="score-badge">' + (m.scoreA !== "-" ? m.scoreA + " : " + m.scoreB : "VS") + '</div>'
      + '      <div class="match-time">🕒 ' + m.time + '</div>'
      + '    </div>'
      + '    <div class="team-col">'
      + '      <div class="team-name">' + m.teamB + '</div>'
      + '      <div class="team-dept">' + m.deptB + '</div>'
      + '    </div>'
      + '  </div>'
      // 팀 각오/코멘트
      + '  <div class="quotes-wrap">'
      + '    <div class="quote-item">'
      + '      <span class="quote-tag tag-a">A팀 각오</span>'
      + '      <span>“' + m.quoteA + '”</span>'
      + '    </div>'
      + '    <div class="quote-item">'
      + '      <span class="quote-tag tag-b">B팀 각오</span>'
      + '      <span>“' + m.quoteB + '”</span>'
      + '    </div>'
      + '  </div>'
      // 승부의 신 투표 박스
      + '  <div class="pickem-box">'
      + '    <div class="pickem-title">'
      + '      <span>🔥 승부의 신 예측 투표</span>'
      + '      <span>' + totalVotes + '명 참여</span>'
      + '    </div>'
      + '    <div class="vote-bar-wrap">'
      + '      <div class="vote-bar-a" style="width:' + rateA + '%"></div>'
      + '    </div>'
      + '    <div class="vote-rate-text">'
      + '      <span class="vote-rate-a">' + rateA + '%</span>'
      + '      <span class="vote-rate-b">' + rateB + '%</span>'
      + '    </div>'
      + '    <div class="vote-actions">'
      + '      <button class="btn-vote btn-vote-a' + votedAClass + '" onclick="voteTeam(\'' + m.id + '\', \'A\')">'
      +          (myVote === 'A' ? '✔ A팀 투표완료' : 'A팀 승리 예측')
      + '      </button>'
      + '      <button class="btn-vote btn-vote-b' + votedBClass + '" onclick="voteTeam(\'' + m.id + '\', \'B\')">'
      +          (myVote === 'B' ? '✔ B팀 투표완료' : 'B팀 승리 예측')
      + '      </button>'
      + '    </div>'
      + '  </div>'
      + '</div>'
      + '</div>';
  });

  listEl.innerHTML = html;
}

/* ==========================================================================
   토너먼트 트리 브래킷 렌더링
========================================================================== */
function renderTree(){
  var game = TOURNAMENT_DATA[currentKey];
  var container = document.getElementById("treeContainer");
  var rounds = ["8강", "4강", "결승"];
  var html = "";

  rounds.forEach(function(rName){
    var matches = game.matches.filter(function(m){ return m.round.indexOf(rName) !== -1; });
    if(matches.length > 0){
      html += '<div class="tree-round">'
        + '<div class="tree-round-title">' + rName + '</div>';
      matches.forEach(function(m){
        var isAWinner = m.status === 'end' && m.scoreA > m.scoreB;
        var isBWinner = m.status === 'end' && m.scoreB > m.scoreA;
        html += '<div class="tree-node' + (isAWinner ? ' winner' : '') + '">'
          + (isAWinner ? '👑 ' : '') + m.teamA + ' (' + m.scoreA + ')</div>'
          + '<div class="tree-node' + (isBWinner ? ' winner' : '') + '">'
          + (isBWinner ? '👑 ' : '') + m.teamB + ' (' + m.scoreB + ')</div>';
      });
      html += '</div>';
    }
  });

  container.innerHTML = html || '<div style="color:#64748b;font-size:12px;padding:20px">브래킷 데이터가 없습니다.</div>';
}

/* ==========================================================================
   투표 인터랙션 핸들러
========================================================================== */
window.voteTeam = function(matchId, pick){
  if(userVotes[matchId]){
    alert("이미 투표를 완료하신 경기입니다!");
    return;
  }
  var game = TOURNAMENT_DATA[currentKey];
  var match = game.matches.find(function(m){ return m.id === matchId; });
  if(!match) return;

  if(match.status === "end"){
    alert("이미 종료된 경기는 투표할 수 없습니다.");
    return;
  }

  if(pick === "A") match.votesA++;
  else match.votesB++;

  userVotes[matchId] = pick;
  renderMatches();
};

/* ==========================================================================
   이벤트 리스너 등록
========================================================================== */
document.addEventListener("DOMContentLoaded", function(){
  // 종목 탭 전환
  var tabs = document.querySelectorAll("#gameTabs .tab-btn");
  tabs.forEach(function(btn){
    btn.addEventListener("click", function(){
      tabs.forEach(function(t){ t.classList.remove("active"); });
      this.classList.add("active");
      currentKey = this.getAttribute("data-game");
      document.getElementById("currentGameTitle").textContent = TOURNAMENT_DATA[currentKey].title + " 대진표";
      renderMatches();
      renderTree();
    });
  });

  // 라운드 필터 버튼
  var roundBtns = document.querySelectorAll("#roundFilter .round-btn");
  roundBtns.forEach(function(btn){
    btn.addEventListener("click", function(){
      roundBtns.forEach(function(b){ b.classList.remove("active"); });
      this.classList.add("active");
      currentRoundFilter = this.getAttribute("data-round");
      renderMatches();
    });
  });

  // 토너먼트 트리 보기 토글
  var btnTreeToggle = document.getElementById("btnTreeToggle");
  var treeView = document.getElementById("treeView");
  btnTreeToggle.addEventListener("click", function(){
    if(treeView.style.display === "block"){
      treeView.style.display = "none";
      btnTreeToggle.textContent = "📊 토너먼트 트리 보기";
    } else {
      treeView.style.display = "block";
      btnTreeToggle.textContent = "✖ 트리 접기";
    }
  });

  // 최초 실행
  renderMatches();
  renderTree();
});
</script>
</body>
</html>
