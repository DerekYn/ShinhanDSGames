<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>실시간 랭킹 - 금융본부 미니 게임대회</title>
<style>
  :root {
    --navy: #0B1F3A;
    --ocean: #123A63;
    --blue: #1B5FA8;
    --sky: #4F9DDE;
    --ice: #BFE2F7;
    --paper: #EAF4FC;
    --accent: #2FBF9E;
    --danger: #E0567A;
    --gold: #FFD700;
    --silver: #E0E7FF;
    --bronze: #F59E0B;
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    --font-num: "Segoe UI", "Consolas", "Malgun Gothic", monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: radial-gradient(circle at 20% 0%, #163A63 0%, var(--navy) 55%, #071426 100%);
    font-family: var(--font-ui);
    color: var(--paper);
    overflow-x: hidden;
    user-select: none;
  }
  #app {
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; min-height: 100dvh; padding: 8px 12px; gap: 8px;
    width: 100%;
  }

  /* 브랜드 헤더 */
  .brand-bar {
    width: 100%; max-width: 640px; display: flex; flex-direction: column; gap: 6px;
    background: linear-gradient(135deg, rgba(255,255,255,0.09), rgba(255,255,255,0.02));
    border: 1px solid rgba(255,255,255,0.16); border-radius: 16px; padding: 8px 12px; box-sizing: border-box;
  }
  .brand-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; }
  .brand-left { display: flex; align-items: center; gap: 10px; }
  .brand-logo { width: 56px; height: 28px; flex-shrink: 0; }
  .brand-logo svg { width: 100%; height: 100%; display: block; }
  .brand-text { display: flex; flex-direction: column; line-height: 1.2; }
  .brand-name { font-size: 13px; font-weight: 800; color: #fff; letter-spacing: -0.02em; }
  .brand-dept {
    display: inline-block; margin-top: 2px; font-size: 10px; font-weight: 800; color: var(--navy);
    background: var(--sky); padding: 2px 8px; border-radius: 999px; width: fit-content; letter-spacing: -0.01em;
  }
  .event-tag {
    font-size: 11px; font-weight: 700; color: var(--ice);
    background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.2);
    padding: 6px 12px; border-radius: 999px; white-space: nowrap; letter-spacing: -0.01em;
  }
  .brand-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }

  /* 바로가기 네비게이션 (공튀기기, 두더지, 사과, 지뢰, 드롭) */
  .nav-games {
    display: flex; align-items: center; justify-content: space-between;
    gap: 5px; width: 100%; overflow-x: auto; padding-top: 4px; border-top: 1px solid rgba(255,255,255,0.08);
  }
  .nav-games::-webkit-scrollbar { display: none; }
  .nav-item {
    flex: 1; min-width: 50px; display: inline-flex; align-items: center; justify-content: center;
    gap: 3px; padding: 5px 6px; border-radius: 10px; background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.12); color: var(--ice); text-decoration: none;
    font-size: 11px; font-weight: 700; transition: all 0.15s ease; white-space: nowrap;
  }
  .nav-item:hover { background: rgba(255,255,255,0.15); color: #fff; transform: translateY(-1px); }

  /* 랭킹 대시보드 메인 카드 */
  .rank-box {
    width: 100%; max-width: 640px;
    background: linear-gradient(180deg, rgba(18, 58, 99, 0.8), rgba(11, 31, 58, 0.95));
    border: 1px solid rgba(255,255,255,0.14); border-radius: 18px; padding: 10px 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.45); display: flex; flex-direction: column; gap: 8px;
  }

  /* 상단 상태 및 새로고침 바 (한 줄 고정) */
  .rank-header {
    display: flex; align-items: center; justify-content: space-between;
    padding-bottom: 6px; border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  .live-badge {
    display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700;
    color: var(--accent); background: rgba(47, 191, 158, 0.12); border: 1px solid var(--accent);
    padding: 2.5px 8px; border-radius: 20px;
  }
  .live-dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
    box-shadow: 0 0 8px var(--accent); animation: pulse 1.2s infinite;
  }
  @keyframes pulse { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }

  .refresh-group { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--ice); }
  .btn-refresh {
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2);
    color: #fff; padding: 3px 9px; border-radius: 8px; font-size: 11px; font-weight: 700;
    cursor: pointer; display: inline-flex; align-items: center; gap: 4px;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .btn-refresh:active { transform: scale(0.96); background: var(--blue); }

  /* 1차 탭 */
  .view-tabs {
    display: flex; gap: 6px; background: rgba(6, 20, 36, 0.6);
    padding: 3px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.08);
  }
  .view-tab {
    flex: 1; padding: 7px 0; text-align: center; font-size: 12.5px; font-weight: 800;
    color: var(--ice); border-radius: 9px; cursor: pointer; transition: all 0.15s ease;
  }
  .view-tab.active { background: var(--blue); color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }

  /* 2차 종목 선택 탭 */
  .game-pills { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
  .game-pills::-webkit-scrollbar { display: none; }
  .game-pill {
    flex: 1; min-width: 50px; padding: 5px 6px; text-align: center;
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px; font-size: 11px; font-weight: 700; color: var(--ice);
    cursor: pointer; white-space: nowrap; transition: all 0.15s ease;
  }
  .game-pill.active {
    background: linear-gradient(135deg, var(--sky), var(--blue));
    border-color: var(--sky); color: #fff; box-shadow: 0 2px 8px rgba(79, 157, 222, 0.35);
  }

  .rule-banner {
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(6, 20, 36, 0.5); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px; padding: 5px 10px; font-size: 11px; color: var(--ice);
  }
  .rule-badge { color: var(--sky); font-weight: 700; }

  /* 내 순위 VIP 카드 (터치 시 정보 수정 가능) */
  .my-rank-card {
    display: flex; align-items: center; justify-content: space-between;
    background: linear-gradient(135deg, rgba(79, 157, 222, 0.22), rgba(18, 58, 99, 0.85));
    border: 1.5px solid var(--sky); border-radius: 14px; padding: 8px 12px;
    box-shadow: 0 4px 15px rgba(79, 157, 222, 0.25);
    cursor: pointer;
    transition: transform 0.1s ease, border-color 0.15s ease;
  }
  .my-rank-card:active { transform: scale(0.98); }
  .my-rank-left { display: flex; align-items: center; gap: 10px; }
  .my-rank-badge {
    background: var(--sky); color: var(--navy); font-weight: 900;
    font-size: 11px; padding: 2.5px 6px; border-radius: 6px; letter-spacing: -0.02em;
  }
  .my-rank-info { display: flex; flex-direction: column; gap: 2px; }
  .my-rank-title { font-size: 13px; font-weight: 800; color: #fff; }
  .my-rank-title b { color: var(--gold); font-size: 14.5px; }
  .my-rank-sub { font-size: 11px; color: var(--ice); font-weight: 700; opacity: 0.95; }
  .my-rank-score {
    font-family: var(--font-num); font-size: 16px; font-weight: 800;
    color: var(--accent); text-align: right;
  }

  /* 포디움 */
  .podium {
    display: grid; grid-template-columns: 1fr 1.15fr 1fr; gap: 8px;
    align-items: flex-end; padding: 6px 4px 4px;
  }
  .podium-card {
    background: rgba(6, 20, 36, 0.75); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 14px; padding: 8px 6px 8px; text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
  }
  .podium-card.first {
    border-color: var(--gold);
    background: linear-gradient(180deg, rgba(255, 215, 0, 0.14), rgba(6, 20, 36, 0.85));
    transform: translateY(-5px);
  }
  .podium-card.second {
    border-color: #cbd5e1;
    background: linear-gradient(180deg, rgba(203, 213, 225, 0.1), rgba(6, 20, 36, 0.85));
  }
  .podium-card.third {
    border-color: var(--bronze);
    background: linear-gradient(180deg, rgba(245, 158, 11, 0.1), rgba(6, 20, 36, 0.85));
  }
  .podium-medal { font-size: 22px; line-height: 1; }
  .podium-team { font-size: 11px; font-weight: 700; color: #fff; margin-top: 1px; }
  .podium-sabun { font-size: 10px; color: var(--ice); opacity: 0.8; }
  .podium-score {
    font-family: var(--font-num); font-size: 15px; font-weight: 800;
    color: var(--accent); margin-top: 3px;
  }
  .podium-card.first .podium-score { font-size: 17px; color: var(--gold); }

  /* 4~10위 리스트 */
  .rank-list { display: flex; flex-direction: column; gap: 5px; width: 100%; }
  .rank-row {
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(6, 20, 36, 0.55); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px; padding: 7px 10px; font-size: 11.5px;
  }
  .rank-row.is-me {
    background: rgba(79, 157, 222, 0.16); border-color: var(--sky);
  }
  .rank-row-left { display: flex; align-items: center; gap: 8px; }
  .rank-num {
    font-family: var(--font-num); font-weight: 800; font-size: 12.5px;
    color: var(--ice); width: 18px; text-align: center;
  }
  .rank-team { font-weight: 700; color: #fff; }
  .rank-sabun { font-size: 10.5px; color: var(--ice); opacity: 0.75; }
  .rank-val { font-family: var(--font-num); font-weight: 800; font-size: 13.5px; color: var(--sky); }

  /* 팀 대항전 */
  .team-list { display: flex; flex-direction: column; gap: 6px; width: 100%; }
  .team-card {
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(6, 20, 36, 0.7); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px; padding: 10px 12px; position: relative;
  }
  .team-card.rank-1 {
    border-color: var(--gold); background: linear-gradient(135deg, rgba(255, 215, 0, 0.12), rgba(6, 20, 36, 0.8));
  }
  .team-card.is-my-team { border-color: var(--sky); box-shadow: 0 0 10px rgba(79, 157, 222, 0.3); }
  .team-left { display: flex; align-items: center; gap: 10px; }
  .team-badge {
    width: 26px; height: 26px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
    font-family: var(--font-num); font-weight: 800; font-size: 12px; background: rgba(255,255,255,0.08); color: #fff;
  }
  .team-card.rank-1 .team-badge { background: var(--gold); color: #041224; }
  .team-card.rank-2 .team-badge { background: #cbd5e1; color: #041224; }
  .team-card.rank-3 .team-badge { background: var(--bronze); color: #041224; }
  .team-info { display: flex; flex-direction: column; gap: 2px; }
  .team-title { font-size: 13px; font-weight: 800; color: #fff; }
  .team-sub { font-size: 10.5px; color: var(--ice); opacity: 0.75; }
  .team-score-box { text-align: right; }
  .team-score { font-family: var(--font-num); font-size: 16px; font-weight: 800; color: var(--accent); }
  .team-card.rank-1 .team-score { color: var(--gold); }
  .team-score-lbl { font-size: 9.5px; color: var(--ice); opacity: 0.75; }

  /* 모달 레이아웃 */
  #authOverlay {
    position: fixed; inset: 0;
    background: rgba(4,12,24,0.85);
    display: none; align-items: center; justify-content: center; z-index: 100;
    padding: 20px;
  }
  #authOverlay.show { display: flex; }
  .modal {
    background: linear-gradient(180deg, #123A63, #0B1F3A);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 18px;
    padding: 28px 24px;
    text-align: center;
    min-width: 260px;
    max-width: 380px;
    width: 92%;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
  }
  .modal h2 { margin: 0 0 8px; font-size: 19px; color: #fff; }
  .modal p { margin: 0 0 16px; color: var(--ice); font-size: 12.5px; line-height: 1.6; }
  .auth-input {
    width: 100%; padding: 11px 14px;
    border: 1px solid rgba(255,255,255,0.25); border-radius: 10px;
    background: rgba(255,255,255,0.08); color: #fff; font-size: 15px;
    font-family: var(--font-num); text-align: center; margin-bottom: 12px; outline: none;
  }
  .auth-input:focus { border-color: var(--sky); background: rgba(255,255,255,0.12); }
  .auth-input.error { border-color: var(--danger); }
  select.auth-input {
    appearance: none; -webkit-appearance: none; -moz-appearance: none;
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23BFE2F7' stroke-width='2'%3e%3cpath d='M6 9l6 6 6-6'/%3e%3c/svg%3e");
    background-repeat: no-repeat; background-position: right 12px center; background-size: 18px;
    text-align: left; padding-right: 38px; cursor: pointer;
  }
  select.auth-input option { background: #123A63; color: #fff; }
  .auth-error { color: var(--danger); font-size: 12px; margin: -6px 0 12px; height: 14px; display: block; }
  
  button.main {
    font-family: var(--font-ui); font-size: 13.5px; font-weight: 700;
    background: var(--blue); color: #fff; border: none;
    padding: 9px 18px; border-radius: 10px; cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  button.main:hover { background: var(--sky); }
  button.main:active { transform: scale(0.97); }
  button.ghost {
    background: transparent; border: 1px solid rgba(255,255,255,0.25);
    color: var(--ice); font-family: var(--font-ui); font-size: 13.5px; font-weight: 700;
    padding: 9px 18px; border-radius: 10px; cursor: pointer;
    transition: background 0.15s ease;
  }
  button.ghost:hover { background: rgba(255,255,255,0.08); }

  /* 로딩 스피너 및 에러 상태 */
  .state-box {
    text-align: center; padding: 36px 16px; color: var(--ice); font-size: 13px; line-height: 1.6;
  }
  .spinner {
    width: 32px; height: 32px; border: 3px solid rgba(255,255,255,0.15);
    border-top-color: var(--sky); border-radius: 50%;
    animation: spin 0.8s linear infinite; margin: 0 auto 10px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- 사번/팀 정보 수정 모달 -->
<div id="authOverlay">
  <div class="modal">
    <h2>👤 플레이어 정보 설정</h2>
    <p>사내 랭킹 집계 및 참여 기록 확인을 위해<br>팀과 사번을 설정해 주세요.</p>
    <select id="teamSelect" class="auth-input">
      <option value="" disabled selected>팀 선택</option>
      <option value="증권개발팀">증권개발팀</option>
      <option value="증권채널팀">증권채널팀</option>
      <option value="카드개발팀">카드개발팀</option>
      <option value="라이프개발팀">라이프개발팀</option>
      <option value="기타">기타</option>
      <option value="영포스">영포스</option>
    </select>
    <input type="text" id="sabunInput" class="auth-input" placeholder="사번 8자리 (예: 22091019)" maxlength="8" inputmode="numeric" pattern="[0-9]*">
    <span class="auth-error" id="authError"></span>
    <div style="display:flex; gap:8px;">
      <button type="button" class="main" id="authSaveBtn" style="flex:1;">저장</button>
      <button type="button" class="ghost" id="authCloseBtn" style="flex:1;">닫기</button>
    </div>
  </div>
</div>

<div id="app">
  <!-- 브랜드 바 -->
  <div class="brand-bar" id="brandBar">
    <div class="brand-top">
      <div class="brand-left">
        <div class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 68 34" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#4F9DDE"/>
                <stop offset="1" stop-color="#123A63"/>
              </linearGradient>
            </defs>
            <rect x="1" y="1" width="66" height="32" rx="8" fill="url(#logoGrad)" stroke="rgba(255,255,255,0.25)"/>
            <text x="34" y="17" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif" font-weight="800" font-size="14" fill="#fff" letter-spacing="-0.02em">신한DS</text>
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-name">금융본부 🏆 소통 미니게임대회</span>
          <span class="brand-dept">3분기 리버스 멘토링</span>
        </div>
      </div>
      <div class="brand-right">
        <div class="event-tag">🏆 실시간 랭킹</div>
      </div>
    </div>
    
    <nav class="nav-games" aria-label="게임 종목 바로가기">
      <a href="ball.html" class="nav-item">⚽ 공튀기기</a>
      <a href="mole.html" class="nav-item">🐹 두더지</a>
      <a href="apple.html" class="nav-item">🍎 사과</a>
      <a href="bomb.html" class="nav-item">💣 지뢰</a>
      <a href="drop.html" class="nav-item">💧 드롭</a>
    </nav>
  </div>

  <!-- 랭킹 메인 패널 -->
  <div class="rank-box">
    <div class="rank-header">
      <div class="live-badge">
        <span class="live-dot"></span>
        <span>실시간 순위</span>
      </div>
      <div class="refresh-group">
        <span id="countdownText">15초 후 갱신</span>
        <button class="btn-refresh" id="btnManualRefresh" type="button">새로고침</button>
      </div>
    </div>

    <!-- 1차 탭: 개인전 / 팀 대항전 -->
    <div class="view-tabs">
      <div class="view-tab active" id="tabPersonal">종목별 개인 순위</div>
      <div class="view-tab" id="tabTeam">팀별 대항전 순위</div>
    </div>

    <!-- 2차 종목 선택 (공튀기기, 두더지, 사과, 지뢰, 드롭) -->
    <div id="gameSelectorSection">
      <div class="game-pills">
        <div class="game-pill active" data-game="공튀기기">⚽ 공튀기기</div>
        <div class="game-pill" data-game="두더지잡기">🐹 두더지</div>
        <div class="game-pill" data-game="사과게임">🍎 사과</div>
        <div class="game-pill" data-game="지뢰찾기">💣 지뢰</div>
        <div class="game-pill" data-game="드롭">💧 드롭</div>
      </div>
    </div>

    <div class="rule-banner" id="ruleBanner">
      <span id="ruleDesc">5개 스테이지 최단 시간 올클리어</span>
      <span class="rule-badge" id="ruleType">최단 시간순</span>
    </div>

    <!-- 최초 로딩 화면 -->
    <div class="state-box" id="initialLoadingBox">
      <div class="spinner"></div>
      <div>실시간 순위 집계 중... 잠시만 기다려주세요 🙂</div>
    </div>

    <!-- 개인 순위 컨테이너 -->
    <div id="personalContainer" style="display:none; flex-direction:column; gap:8px;">
      <!-- 내 순위 VIP 카드 (최상단) -->
      <div class="my-rank-card" id="myPersonalCard" title="클릭 시 플레이어 정보 변경"></div>
      <!-- 포디움 -->
      <div class="podium" id="podiumArea"></div>
      <!-- 4~10위 리스트 -->
      <div class="rank-list" id="rankListArea"></div>
    </div>

    <!-- 팀 대항전 컨테이너 -->
    <div id="teamContainer" style="display:none; flex-direction:column; gap:8px;">
      <!-- 우리 팀 순위 VIP 카드 -->
      <div class="my-rank-card" id="myTeamCard" title="클릭 시 플레이어 정보 변경"></div>
      <!-- 팀 순위 리스트 -->
      <div class="team-list" id="teamListArea"></div>
    </div>

    <!-- 빈 데이터 안내 화면 -->
    <div class="state-box" id="emptyState" style="display:none;">
      <div style="font-size:30px; margin-bottom:6px;">📊</div>
      <div id="emptyMsg">아직 기록된 랭킹 데이터가 없습니다.</div>
    </div>
  </div>
</div>

<script>
(function(){
  var GOOGLE_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbwXeZ1OMPgMQb-JhW_uOAxQ-w1sTq5kb6XbTa6XF3BjzhVrax6uvPc8LBC0YfTSKiZKEQ/exec";

  var currentView = "personal";
  var currentGame = "공튀기기";
  var isFirstLoadDone = false;

  var myTeam = "";
  var mySabun = "";
  try {
    myTeam = localStorage.getItem("sh_mini_team") || "";
    mySabun = localStorage.getItem("sh_mini_sabun") || "";
  } catch(e) {}

  var GAME_META = {
    "공튀기기": { desc: "5개 스테이지 최단 시간 올클리어", badge: "최단 시간순", unit: "초", isTime: true },
    "두더지잡기": { desc: "30초 동안 잡은 두더지 콤보 합산 점수", badge: "높은 점수순", unit: "점", isTime: false },
    "사과게임": { desc: "합 10을 완성해 획득한 사과 개수", badge: "높은 점수순", unit: "점", isTime: false },
    "지뢰찾기": { desc: "12x12 지뢰 24개를 피해 모든 칸 오픈", badge: "최단 시간순", unit: "초", isTime: true },
    "드롭": { desc: "60초 동안 바구니로 받은 아이템 합산 점수", badge: "높은 점수순", unit: "점", isTime: false }
  };

  var cachedData = { games: {}, teams: [] };
  var REFRESH_INTERVAL = 15;
  var countdown = REFRESH_INTERVAL;
  var countdownTimer = null;

  var tabPersonal = document.getElementById("tabPersonal");
  var tabTeam = document.getElementById("tabTeam");
  var gameSelectorSection = document.getElementById("gameSelectorSection");
  var personalContainer = document.getElementById("personalContainer");
  var teamContainer = document.getElementById("teamContainer");
  var initialLoadingBox = document.getElementById("initialLoadingBox");
  var emptyState = document.getElementById("emptyState");
  var emptyMsg = document.getElementById("emptyMsg");
  var myPersonalCard = document.getElementById("myPersonalCard");
  var myTeamCard = document.getElementById("myTeamCard");
  var podiumArea = document.getElementById("podiumArea");
  var rankListArea = document.getElementById("rankListArea");
  var teamListArea = document.getElementById("teamListArea");
  var ruleBanner = document.getElementById("ruleBanner");
  var ruleDesc = document.getElementById("ruleDesc");
  var ruleType = document.getElementById("ruleType");
  var countdownText = document.getElementById("countdownText");
  var btnManualRefresh = document.getElementById("btnManualRefresh");

  var authOverlay = document.getElementById("authOverlay");
  var teamSelect = document.getElementById("teamSelect");
  var sabunInput = document.getElementById("sabunInput");
  var authError = document.getElementById("authError");
  var authSaveBtn = document.getElementById("authSaveBtn");
  var authCloseBtn = document.getElementById("authCloseBtn");

  // VIP 카드 클릭 시 정보 변경 모달 열기
  function openAuthModal() {
    if (teamSelect && myTeam) teamSelect.value = myTeam;
    if (sabunInput && mySabun) sabunInput.value = mySabun;
    authError.textContent = "";
    authOverlay.classList.add("show");
  }

  myPersonalCard.addEventListener("click", openAuthModal);
  myTeamCard.addEventListener("click", openAuthModal);

  authCloseBtn.addEventListener("click", function(){
    authOverlay.classList.remove("show");
  });

  authSaveBtn.addEventListener("click", function(e){
    if (e) e.preventDefault();
    var tVal = teamSelect.value;
    var sVal = (sabunInput.value || "").replace(/[^0-9]/g, "").trim();

    if (!tVal) {
      authError.textContent = "팀을 선택해 주세요.";
      teamSelect.focus();
      return;
    }
    if (sVal.length !== 8) {
      authError.textContent = "사번은 숫자 8자리여야 합니다. (예: 22091019)";
      sabunInput.focus();
      return;
    }

    myTeam = tVal;
    mySabun = sVal;
    try {
      localStorage.setItem("sh_mini_team", myTeam);
      localStorage.setItem("sh_mini_sabun", mySabun);
    } catch(err) {}

    authOverlay.classList.remove("show");
    render();
  });

  tabPersonal.addEventListener("click", function(){
    currentView = "personal";
    tabPersonal.classList.add("active");
    tabTeam.classList.remove("active");
    gameSelectorSection.style.display = "block";
    ruleBanner.style.display = "flex";
    render();
  });

  tabTeam.addEventListener("click", function(){
    currentView = "team";
    tabTeam.classList.add("active");
    tabPersonal.classList.remove("active");
    gameSelectorSection.style.display = "none";
    ruleBanner.style.display = "none";
    render();
  });

  document.querySelectorAll(".game-pill").forEach(function(pill){
    pill.addEventListener("click", function(){
      document.querySelectorAll(".game-pill").forEach(function(p){ p.classList.remove("active"); });
      pill.classList.add("active");
      currentGame = pill.getAttribute("data-game");
      render();
    });
  });

  function formatScore(val, isTime){
    if (isTime) return Number(val).toFixed(1) + "초";
    return Math.round(Number(val)) + "점";
  }

  function maskSabun(sabun){
    var s = String(sabun || "");
    if (s.length <= 3) return s;
    return s.slice(0, 3) + "*".repeat(s.length - 3);
  }

  function render(){
    if (!isFirstLoadDone) return;

    initialLoadingBox.style.display = "none";
    emptyState.style.display = "none";

    if (currentView === "personal") {
      teamContainer.style.display = "none";
      renderPersonalRank();
    } else {
      personalContainer.style.display = "none";
      renderTeamRank();
    }
  }

  function renderPersonalRank(){
    var meta = GAME_META[currentGame] || GAME_META["공튀기기"];
    ruleDesc.textContent = meta.desc;
    ruleType.textContent = meta.badge;

    var list = (cachedData.games && cachedData.games[currentGame]) || [];

    if (list.length === 0) {
      personalContainer.style.display = "none";
      emptyState.style.display = "block";
      emptyMsg.textContent = "아직 등록된 기록이 없습니다.\n첫 번째 랭커에 도전해 보세요!";
      return;
    }

    personalContainer.style.display = "flex";

    var myIndex = -1;
    if (mySabun) {
      for (var i = 0; i < list.length; i++) {
        if (String(list[i].sabun).trim() === String(mySabun).trim()) {
          myIndex = i;
          break;
        }
      }
    }

    // [수정 완료] 마스킹을 해제하고 플레이어: 팀명 - 사번 형태로 정밀 표출
    var displayTeam = myTeam || (myIndex !== -1 ? list[myIndex].team : "미등록");

    if (mySabun && myIndex !== -1) {
      var myRecord = list[myIndex];
      var myRankNum = myRecord.rank || (myIndex + 1);
      myPersonalCard.innerHTML = 
        '<div class="my-rank-left">' +
          '<span class="my-rank-badge">MY</span>' +
          '<div class="my-rank-info">' +
            '<span class="my-rank-title">내 현재 순위: <b>' + myRankNum + '위</b></span>' +
            '<span class="my-rank-sub">플레이어: ' + displayTeam + ' - ' + mySabun + '</span>' +
          '</div>' +
        '</div>' +
        '<div class="my-rank-score">' + formatScore(myRecord.score, meta.isTime) + '</div>';
      myPersonalCard.style.display = "flex";
    } else if (mySabun) {
      myPersonalCard.innerHTML = 
        '<div class="my-rank-left">' +
          '<span class="my-rank-badge">MY</span>' +
          '<div class="my-rank-info">' +
            '<span class="my-rank-title">내 현재 순위: <b>순위권 진입 도전!</b></span>' +
            '<span class="my-rank-sub">플레이어: ' + displayTeam + ' - ' + mySabun + '</span>' +
          '</div>' +
        '</div>' +
        '<div class="my-rank-score" style="font-size:12px; color:var(--ice);">도전하기 👉</div>';
      myPersonalCard.style.display = "flex";
    } else {
      myPersonalCard.innerHTML = 
        '<div class="my-rank-left">' +
          '<span class="my-rank-badge">MY</span>' +
          '<div class="my-rank-info">' +
            '<span class="my-rank-title">내 순위 확인</span>' +
            '<span class="my-rank-sub">플레이어 등록하기 (터치) 👉</span>' +
          '</div>' +
        '</div>' +
        '<div class="my-rank-score" style="font-size:12px; color:var(--ice);">등록</div>';
      myPersonalCard.style.display = "flex";
    }

    var top3 = list.slice(0, 3);
    var first = top3[0], second = top3[1], third = top3[2];
    var podiumHtml = "";

    podiumHtml += second ? (
      '<div class="podium-card second">' +
        '<div class="podium-medal">🥈</div>' +
        '<div class="podium-team">' + second.team + '</div>' +
        '<div class="podium-sabun">' + maskSabun(second.sabun) + '</div>' +
        '<div class="podium-score">' + formatScore(second.score, meta.isTime) + '</div>' +
      '</div>'
    ) : '<div class="podium-card second" style="opacity:0.3;"><div class="podium-medal">🥈</div><div class="podium-team">-</div></div>';

    podiumHtml += first ? (
      '<div class="podium-card first">' +
        '<div class="podium-medal">🥇</div>' +
        '<div class="podium-team">' + first.team + '</div>' +
        '<div class="podium-sabun">' + maskSabun(first.sabun) + '</div>' +
        '<div class="podium-score">' + formatScore(first.score, meta.isTime) + '</div>' +
      '</div>'
    ) : '<div class="podium-card first" style="opacity:0.3;"><div class="podium-medal">🥇</div><div class="podium-team">-</div></div>';

    podiumHtml += third ? (
      '<div class="podium-card third">' +
        '<div class="podium-medal">🥉</div>' +
        '<div class="podium-team">' + third.team + '</div>' +
        '<div class="podium-sabun">' + maskSabun(third.sabun) + '</div>' +
        '<div class="podium-score">' + formatScore(third.score, meta.isTime) + '</div>' +
      '</div>'
    ) : '<div class="podium-card third" style="opacity:0.3;"><div class="podium-medal">🥉</div><div class="podium-team">-</div></div>';

    podiumArea.innerHTML = podiumHtml;

    var restList = list.slice(3, 10);
    var listHtml = "";
    restList.forEach(function(item, idx){
      var rank = idx + 4;
      var isMe = (mySabun && String(item.sabun).trim() === String(mySabun).trim());
      listHtml += '<div class="rank-row ' + (isMe ? 'is-me' : '') + '">' +
        '<div class="rank-row-left">' +
          '<span class="rank-num">' + rank + '</span>' +
          '<div>' +
            '<span class="rank-team">' + item.team + '</span> ' +
            '<span class="rank-sabun">(' + maskSabun(item.sabun) + ')' + (isMe ? ' 👈 나' : '') + '</span>' +
          '</div>' +
        '</div>' +
        '<span class="rank-val">' + formatScore(item.score, meta.isTime) + '</span>' +
      '</div>';
    });

    rankListArea.innerHTML = listHtml;
  }

  function renderTeamRank(){
    var list = cachedData.teams || [];
    if (list.length === 0) {
      teamContainer.style.display = "none";
      emptyState.style.display = "block";
      emptyMsg.textContent = "팀별 참여 기록을 집계 중입니다.";
      return;
    }

    teamContainer.style.display = "flex";

    var myTeamObj = null;
    var myTeamRank = -1;
    if (myTeam) {
      for (var i = 0; i < list.length; i++) {
        if (list[i].team === myTeam) {
          myTeamObj = list[i];
          myTeamRank = i + 1;
          break;
        }
      }
    }

    if (myTeamObj) {
      myTeamCard.innerHTML = 
        '<div class="my-rank-left">' +
          '<span class="my-rank-badge">MY TEAM</span>' +
          '<div class="my-rank-info">' +
            '<span class="my-rank-title">우리 팀 순위: <b>' + myTeamRank + '위</b> (' + myTeam + ')</span>' +
            '<span class="my-rank-sub">TOP 10 진입 횟수: ' + myTeamObj.topRankCount + '회</span>' +
          '</div>' +
        '</div>' +
        '<div class="my-rank-score">' + myTeamObj.totalPoints + ' pts</div>';
      myTeamCard.style.display = "flex";
    } else {
      myTeamCard.style.display = "none";
    }

    var html = "";
    list.forEach(function(item, idx){
      var rank = idx + 1;
      var rankClass = rank <= 3 ? ("rank-" + rank) : "";
      var isMyTeam = (myTeam && item.team === myTeam);
      var medal = rank === 1 ? "🥇 " : (rank === 2 ? "🥈 " : (rank === 3 ? "🥉 " : ""));

      html += '<div class="team-card ' + rankClass + ' ' + (isMyTeam ? 'is-my-team' : '') + '">' +
        '<div class="team-left">' +
          '<div class="team-badge">' + rank + '</div>' +
          '<div class="team-info">' +
            '<div class="team-title">' + medal + item.team + (isMyTeam ? ' (우리팀)' : '') + '</div>' +
            '<div class="team-sub">TOP 10 진입: ' + item.topRankCount + '회</div>' +
          '</div>' +
        '</div>' +
        '<div class="team-score-box">' +
          '<div class="team-score">' + item.totalPoints + ' pts</div>' +
          '<div class="team-score-lbl">종합 승점</div>' +
        '</div>' +
      '</div>';
    });

    teamListArea.innerHTML = html;
  }

  function fetchRankings(){
    if (!GOOGLE_WEBHOOK_URL) return;

    fetch(GOOGLE_WEBHOOK_URL, { method: "GET", redirect: "follow" })
      .then(function(res){
        if (!res.ok) throw new Error("HTTP error " + res.status);
        return res.json();
      })
      .then(function(data){
        if (data && data.status === "success") {
          cachedData = data;
          isFirstLoadDone = true;

          // 가장 최근에 게임을 플레이한 소속 팀으로 자동 동기화
          if (mySabun && cachedData.games) {
            var latestDate = "";
            var latestTeam = "";
            for (var gName in cachedData.games) {
              var gList = cachedData.games[gName] || [];
              for (var i = 0; i < gList.length; i++) {
                if (String(gList[i].sabun).trim() === String(mySabun).trim()) {
                  var rDate = gList[i].date || "";
                  if (!latestDate || rDate >= latestDate) {
                    latestDate = rDate;
                    latestTeam = gList[i].team;
                  }
                }
              }
            }
            if (latestTeam && latestTeam !== "미선택" && latestTeam !== myTeam) {
              myTeam = latestTeam;
              try { localStorage.setItem("sh_mini_team", myTeam); } catch(e) {}
            }
          }

          render();
        }
      })
      .catch(function(err){
        console.warn("순위 갱신 지연/오류:", err);
        if (!isFirstLoadDone) {
          initialLoadingBox.innerHTML = 
            '<div style="font-size:28px; margin-bottom:8px;">⚠️</div>' +
            '<div>순위 데이터를 불러오지 못했습니다.<br><span style="font-size:11px; opacity:0.7;">잠시 후 다시 새로고침 버튼을 눌러주세요.</span></div>';
        }
      });
  }

  function startAutoRefresh(){
    clearInterval(countdownTimer);
    countdown = REFRESH_INTERVAL;
    countdownTimer = setInterval(function(){
      countdown--;
      countdownText.textContent = countdown + "초 후 갱신";
      if (countdown <= 0) {
        countdown = REFRESH_INTERVAL;
        fetchRankings();
      }
    }, 1000);
  }

  btnManualRefresh.addEventListener("click", function(){
    btnManualRefresh.textContent = "갱신 중...";
    fetchRankings();
    setTimeout(function(){
      btnManualRefresh.textContent = "새로고침";
      countdown = REFRESH_INTERVAL;
    }, 600);
  });

  fetchRankings();
  startAutoRefresh();
})();
</script>
</body>
</html>
