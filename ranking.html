<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>실시간 랭킹 - 금융본부 미니 게임대회</title>
<style>
  :root {
    --navy: #0B1F3A;
    --ocean: #123A63;
    --blue: #1B5FA8;
    --sky: #4F9DDE;
    --ice: #BFE2F7;
    --paper: #EAF4FC;
    --accent: #2FBF9E;
    --danger: #E0567A;
    --gold: #FFD700;
    --silver: #E0E7FF;
    --bronze: #F59E0B;
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    --font-num: "Segoe UI", "Consolas", "Malgun Gothic", monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: radial-gradient(circle at 20% 0%, #163A63 0%, var(--navy) 55%, #071426 100%);
    font-family: var(--font-ui);
    color: var(--paper);
    overflow-x: hidden;
    user-select: none;
  }
  #app {
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; min-height: 100dvh; padding: 12px; gap: 10px;
    width: 100%;
  }

  /* 브랜드 헤더 */
  .brand-bar {
    width: 100%;
    max-width: 640px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    background: linear-gradient(135deg, rgba(255,255,255,0.09), rgba(255,255,255,0.02));
    border: 1px solid rgba(255,255,255,0.16);
    border-radius: 16px;
    padding: 8px 12px;
    box-sizing: border-box;
  }
  .brand-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    width: 100%;
  }
  .brand-left { display: flex; align-items: center; gap: 10px; }
  .brand-logo { width: 32px; height: 32px; flex-shrink: 0; }
  .brand-logo svg { width: 100%; height: 100%; display: block; }
  .brand-text { display: flex; flex-direction: column; line-height: 1.2; }
  .brand-name { font-size: 13px; font-weight: 800; color: #fff; letter-spacing: -0.02em; }
  .brand-dept {
    display: inline-block; margin-top: 2px;
    font-size: 10px; font-weight: 800; color: var(--navy);
    background: var(--sky); padding: 2px 8px; border-radius: 999px;
    width: fit-content; letter-spacing: -0.01em;
  }
  .event-tag {
    font-size: 11px; font-weight: 700; color: var(--ice);
    background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.2);
    padding: 6px 12px; border-radius: 999px; white-space: nowrap; letter-spacing: -0.01em;
  }

  .nav-toggle {
    width: 26px; height: 26px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.18);
    border-radius: 8px; color: var(--ice); cursor: pointer;
  }
  .nav-toggle svg { width: 14px; height: 14px; transition: transform 0.2s ease; display: block; }
  .brand-bar.collapsed .nav-games { display: none; }
  .brand-bar.collapsed .nav-toggle svg { transform: rotate(-90deg); }
  .brand-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }

  /* 바로가기 네비게이션 */
  .nav-games {
    display: flex; align-items: center; justify-content: space-between;
    gap: 5px; width: 100%; overflow-x: auto; padding-top: 4px;
    border-top: 1px solid rgba(255,255,255,0.08);
  }
  .nav-games::-webkit-scrollbar { display: none; }
  .nav-item {
    flex: 1; min-width: 50px;
    display: inline-flex; align-items: center; justify-content: center;
    gap: 3px; padding: 5px 6px; border-radius: 10px;
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12);
    color: var(--ice); text-decoration: none; font-size: 11px; font-weight: 700;
    transition: all 0.15s ease; white-space: nowrap;
  }
  .nav-item:hover { background: rgba(255,255,255,0.15); color: #fff; transform: translateY(-1px); }
  .nav-item.active {
    background: var(--blue); border-color: var(--sky); color: #fff;
    box-shadow: 0 0 10px rgba(79, 157, 222, 0.4);
  }

  /* 랭킹 대시보드 메인 카드 */
  .rank-box {
    width: 100%; max-width: 640px;
    background: linear-gradient(180deg, rgba(18, 58, 99, 0.8), rgba(11, 31, 58, 0.95));
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 18px; padding: 14px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.45);
    display: flex; flex-direction: column; gap: 12px;
  }

  /* 상단 상태 및 새로고침 바 */
  .rank-header {
    display: flex; align-items: center; justify-content: space-between;
    padding-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  .live-badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 700; color: var(--accent);
    background: rgba(47, 191, 158, 0.12); border: 1px solid var(--accent);
    padding: 3px 9px; border-radius: 20px;
  }
  .live-dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
    animation: pulse 1.2s infinite;
  }
  @keyframes pulse { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }

  .refresh-group {
    display: flex; align-items: center; gap: 8px;
    font-size: 11px; color: var(--ice);
  }
  .btn-refresh {
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2);
    color: #fff; padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 700;
    cursor: pointer; display: inline-flex; align-items: center; gap: 4px;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .btn-refresh:active { transform: scale(0.96); background: var(--blue); }

  /* 메인 뷰 스위처 (개인전 vs 팀 대항전) */
  .view-tabs {
    display: flex; gap: 6px; background: rgba(6, 20, 36, 0.6);
    padding: 4px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.08);
  }
  .view-tab {
    flex: 1; padding: 9px 0; text-align: center; font-size: 13px; font-weight: 800;
    color: var(--ice); border-radius: 9px; cursor: pointer; transition: all 0.15s ease;
  }
  .view-tab.active {
    background: var(--blue); color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }

  /* 게임 종목 선택 가로 스크롤 탭 */
  .game-pills {
    display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px;
  }
  .game-pills::-webkit-scrollbar { display: none; }
  .game-pill {
    flex: 1; min-width: 68px; padding: 7px 8px; text-align: center;
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px; font-size: 11px; font-weight: 700; color: var(--ice);
    cursor: pointer; white-space: nowrap; transition: all 0.15s ease;
  }
  .game-pill.active {
    background: linear-gradient(135deg, var(--sky), var(--blue));
    border-color: var(--sky); color: #fff;
    box-shadow: 0 2px 8px rgba(79, 157, 222, 0.35);
  }

  /* 규칙 안내 뱃지 */
  .rule-banner {
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(6, 20, 36, 0.5); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px; padding: 6px 12px; font-size: 11px; color: var(--ice);
  }
  .rule-badge {
    color: var(--sky); font-weight: 700;
  }

  /* 포디움 (TOP 1, 2, 3) */
  .podium {
    display: grid; grid-template-columns: 1fr 1.15fr 1fr; gap: 8px;
    align-items: flex-end; padding: 10px 4px 6px;
  }
  .podium-card {
    background: rgba(6, 20, 36, 0.75); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 14px; padding: 12px 6px 10px; text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    position: relative;
  }
  .podium-card.first {
    border-color: var(--gold);
    background: linear-gradient(180deg, rgba(255, 215, 0, 0.14), rgba(6, 20, 36, 0.85));
    transform: translateY(-6px);
  }
  .podium-card.second {
    border-color: #cbd5e1;
    background: linear-gradient(180deg, rgba(203, 213, 225, 0.1), rgba(6, 20, 36, 0.85));
  }
  .podium-card.third {
    border-color: var(--bronze);
    background: linear-gradient(180deg, rgba(245, 158, 11, 0.1), rgba(6, 20, 36, 0.85));
  }

  .podium-medal { font-size: 24px; line-height: 1; }
  .podium-team { font-size: 11px; font-weight: 700; color: #fff; margin-top: 2px; }
  .podium-sabun { font-size: 10px; color: var(--ice); opacity: 0.8; }
  .podium-score {
    font-family: var(--font-num); font-size: 16px; font-weight: 800;
    color: var(--accent); margin-top: 4px;
  }
  .podium-card.first .podium-score { font-size: 18px; color: var(--gold); }

  /* 4~10위 리스트 테이블 */
  .rank-list {
    display: flex; flex-direction: column; gap: 6px; width: 100%;
  }
  .rank-row {
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(6, 20, 36, 0.55); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px; padding: 9px 12px; font-size: 12px;
  }
  .rank-row-left { display: flex; align-items: center; gap: 10px; }
  .rank-num {
    font-family: var(--font-num); font-weight: 800; font-size: 13px;
    color: var(--ice); width: 20px; text-align: center;
  }
  .rank-team { font-weight: 700; color: #fff; }
  .rank-sabun { font-size: 11px; color: var(--ice); opacity: 0.75; }
  .rank-val {
    font-family: var(--font-num); font-weight: 800; font-size: 14px; color: var(--sky);
  }

  /* 팀 대항전 카드 목록 */
  .team-list {
    display: flex; flex-direction: column; gap: 8px; width: 100%;
  }
  .team-card {
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(6, 20, 36, 0.7); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px; padding: 12px 14px; position: relative;
    transition: transform 0.1s ease;
  }
  .team-card.rank-1 {
    border-color: var(--gold);
    background: linear-gradient(135deg, rgba(255, 215, 0, 0.12), rgba(6, 20, 36, 0.8));
  }
  .team-left { display: flex; align-items: center; gap: 12px; }
  .team-badge {
    width: 28px; height: 28px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-num); font-weight: 800; font-size: 13px;
    background: rgba(255,255,255,0.08); color: #fff;
  }
  .team-card.rank-1 .team-badge { background: var(--gold); color: #041224; }
  .team-card.rank-2 .team-badge { background: #cbd5e1; color: #041224; }
  .team-card.rank-3 .team-badge { background: var(--bronze); color: #041224; }

  .team-info { display: flex; flex-direction: column; gap: 2px; }
  .team-title { font-size: 14px; font-weight: 800; color: #fff; }
  .team-sub { font-size: 11px; color: var(--ice); opacity: 0.75; }

  .team-score-box { text-align: right; }
  .team-score {
    font-family: var(--font-num); font-size: 18px; font-weight: 800; color: var(--accent);
  }
  .team-card.rank-1 .team-score { color: var(--gold); }
  .team-score-lbl { font-size: 10px; color: var(--ice); opacity: 0.75; }

  /* 로딩 및 빈 데이터 안내 */
  .empty-state {
    text-align: center; padding: 36px 12px; color: var(--ice); font-size: 13px; line-height: 1.6;
  }
  .empty-state .icon { font-size: 32px; margin-bottom: 8px; display: block; }
</style>
</head>
<body>

<div id="app">
  <!-- 브랜드 바 -->
  <div class="brand-bar" id="brandBar">
    <div class="brand-top">
      <div class="brand-left">
        <div class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#4F9DDE"/>
                <stop offset="1" stop-color="#123A63"/>
              </linearGradient>
            </defs>
            <rect x="1" y="1" width="38" height="38" rx="10" fill="url(#logoGrad)" stroke="rgba(255,255,255,0.25)"/>
            <text x="20" y="27" text-anchor="middle" font-family="Arial, sans-serif" font-weight="800" font-size="18" fill="#fff">SDS</text>
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-name">신한DS 금융본부</span>
          <span class="brand-dept">3분기 리버스 멘토링</span>
        </div>
      </div>
      <div class="brand-right">
        <div class="event-tag">🏆 소통 미니게임대회</div>
        <button class="nav-toggle" id="navToggle" aria-label="게임 목록 접기/펼치기" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
        </button>
      </div>
    </div>
    
    <nav class="nav-games" aria-label="게임 종목 바로가기">
      <a href="ball.html" class="nav-item">⚽ 공튀기기</a>
      <a href="mole.html" class="nav-item">🐹 두더지</a>
      <a href="apple.html" class="nav-item">🍎 사과</a>
      <a href="bomb.html" class="nav-item">💣 지뢰</a>
      <a href="drop.html" class="nav-item">💧 드롭</a>
    </nav>
  </div>

  <script>
  (function(){
    var bar = document.getElementById('brandBar');
    var toggle = document.getElementById('navToggle');
    var KEY = 'sh_mini_navCollapsed';
    if(!bar || !toggle) return;
    var saved = localStorage.getItem(KEY);
    if(saved === '1') bar.classList.add('collapsed');
    toggle.addEventListener('click', function(){
      var collapsed = bar.classList.toggle('collapsed');
      localStorage.setItem(KEY, collapsed ? '1' : '0');
    });
  })();
  </script>

  <!-- 랭킹 메인 패널 -->
  <div class="rank-box">
    <!-- 상태 바 및 갱신 제어 -->
    <div class="rank-header">
      <div class="live-badge">
        <span class="live-dot"></span>
        <span>실시간 순위</span>
      </div>
      <div class="refresh-group">
        <span id="countdownText">15초 후 갱신</span>
        <button class="btn-refresh" id="btnManualRefresh" type="button">새로고침</button>
      </div>
    </div>

    <!-- 1차 탭: 개인 랭킹 vs 팀 대항전 -->
    <div class="view-tabs">
      <div class="view-tab active" id="tabPersonal">종목별 개인 순위</div>
      <div class="view-tab" id="tabTeam">팀별 대항전 순위</div>
    </div>

    <!-- 2차 탭: 종목 선택 (개인 순위 뷰에서만 노출) -->
    <div id="gameSelectorSection">
      <div class="game-pills">
        <div class="game-pill active" data-game="사과게임">🍎 사과</div>
        <div class="game-pill" data-game="두더지잡기">🐹 두더지</div>
        <div class="game-pill" data-game="공튀기기">⚽ 공튀기기</div>
        <div class="game-pill" data-game="지뢰찾기">💣 지뢰</div>
        <div class="game-pill" data-game="드롭">💧 드롭</div>
      </div>
    </div>

    <!-- 규칙 설명 텍스트 -->
    <div class="rule-banner" id="ruleBanner">
      <span id="ruleDesc">합 10을 완성해 획득한 사과 개수</span>
      <span class="rule-badge" id="ruleType">높은 점수순</span>
    </div>

    <!-- 개인 랭킹 컨테이너 -->
    <div id="personalContainer">
      <!-- TOP 3 포디움 -->
      <div class="podium" id="podiumArea"></div>
      <!-- 4위 ~ 10위 리스트 -->
      <div class="rank-list" id="rankListArea"></div>
    </div>

    <!-- 팀 대항전 컨테이너 (기본 숨김) -->
    <div id="teamContainer" style="display:none;">
      <div class="team-list" id="teamListArea"></div>
    </div>

    <!-- 데이터 로딩/에러 표시 -->
    <div class="empty-state" id="emptyState" style="display:none;">
      <span class="icon">📊</span>
      <span id="emptyMsg">기록을 집계하고 있습니다...</span>
    </div>
  </div>
</div>

<script>
(function(){
  var GOOGLE_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbyY6mM4y9ltyZhDn7fMCctYajEBye1sxZpQrQ-FcabhllionztMTlJEJMCKCDy_ZxCOMg/exec";

  var currentView = "personal"; // "personal" | "team"
  var currentGame = "사과게임";

  var GAME_META = {
    "사과게임": { desc: "합 10을 완성해 획득한 사과 개수", badge: "높은 점수순", unit: "점", isTime: false },
    "두더지잡기": { desc: "20초 동안 잡은 두더지 콤보 합산 점수", badge: "높은 점수순", unit: "점", isTime: false },
    "공튀기기": { desc: "5개 스테이지를 최단 시간 내 올클리어", badge: "최단 시간순", unit: "초", isTime: true },
    "지뢰찾기": { desc: "12x12 지뢰 24개를 피해 모든 칸 오픈", badge: "최단 시간순", unit: "초", isTime: true },
    "드롭": { desc: "60초 동안 바구니로 받은 아이템 합산 점수", badge: "높은 점수순", unit: "점", isTime: false }
  };

  var cachedData = {
    updatedAt: "방금 전",
    games: {},
    teams: []
  };

  var REFRESH_INTERVAL = 15;
  var countdown = REFRESH_INTERVAL;
  var countdownTimer = null;

  var tabPersonal = document.getElementById("tabPersonal");
  var tabTeam = document.getElementById("tabTeam");
  var gameSelectorSection = document.getElementById("gameSelectorSection");
  var personalContainer = document.getElementById("personalContainer");
  var teamContainer = document.getElementById("teamContainer");
  var podiumArea = document.getElementById("podiumArea");
  var rankListArea = document.getElementById("rankListArea");
  var teamListArea = document.getElementById("teamListArea");
  var ruleBanner = document.getElementById("ruleBanner");
  var ruleDesc = document.getElementById("ruleDesc");
  var ruleType = document.getElementById("ruleType");
  var countdownText = document.getElementById("countdownText");
  var btnManualRefresh = document.getElementById("btnManualRefresh");
  var emptyState = document.getElementById("emptyState");
  var emptyMsg = document.getElementById("emptyMsg");

  tabPersonal.addEventListener("click", function(){
    currentView = "personal";
    tabPersonal.classList.add("active");
    tabTeam.classList.remove("active");
    gameSelectorSection.style.display = "block";
    ruleBanner.style.display = "flex";
    personalContainer.style.display = "block";
    teamContainer.style.display = "none";
    render();
  });

  tabTeam.addEventListener("click", function(){
    currentView = "team";
    tabTeam.classList.add("active");
    tabPersonal.classList.remove("active");
    gameSelectorSection.style.display = "none";
    ruleBanner.style.display = "none";
    personalContainer.style.display = "none";
    teamContainer.style.display = "block";
    render();
  });

  document.querySelectorAll(".game-pill").forEach(function(pill){
    pill.addEventListener("click", function(){
      document.querySelectorAll(".game-pill").forEach(function(p){ p.classList.remove("active"); });
      pill.classList.add("active");
      currentGame = pill.getAttribute("data-game");
      render();
    });
  });

  function render(){
    if (currentView === "personal") {
      renderPersonalRank();
    } else {
      renderTeamRank();
    }
  }

  function formatScore(val, isTime){
    if (isTime) {
      return Number(val).toFixed(1) + "초";
    }
    return Math.round(Number(val)) + "점";
  }

  function maskSabun(sabun){
    var s = String(sabun);
    if (s.length <= 3) return s;
    return s.slice(0, 3) + "*".repeat(s.length - 3);
  }

  function renderPersonalRank(){
    var meta = GAME_META[currentGame] || GAME_META["사과게임"];
    ruleDesc.textContent = meta.desc;
    ruleType.textContent = meta.badge;

    var list = (cachedData.games && cachedData.games[currentGame]) || [];

    if (list.length === 0) {
      podiumArea.innerHTML = "";
      rankListArea.innerHTML = "";
      emptyState.style.display = "block";
      emptyMsg.textContent = "아직 기록된 랭킹 데이터가 없습니다.\n첫 번째 랭커에 도전해 보세요!";
      return;
    }
    emptyState.style.display = "none";

    var top3 = list.slice(0, 3);
    var first = top3[0];
    var second = top3[1];
    var third = top3[2];

    var podiumHtml = "";

    if (second) {
      podiumHtml += '<div class="podium-card second">' +
        '<div class="podium-medal">🥈</div>' +
        '<div class="podium-team">' + second.team + '</div>' +
        '<div class="podium-sabun">' + maskSabun(second.sabun) + '</div>' +
        '<div class="podium-score">' + formatScore(second.score, meta.isTime) + '</div>' +
      '</div>';
    } else {
      podiumHtml += '<div class="podium-card second" style="opacity:0.3;"><div class="podium-medal">🥈</div><div class="podium-team">-</div></div>';
    }

    if (first) {
      podiumHtml += '<div class="podium-card first">' +
        '<div class="podium-medal">🥇</div>' +
        '<div class="podium-team">' + first.team + '</div>' +
        '<div class="podium-sabun">' + maskSabun(first.sabun) + '</div>' +
        '<div class="podium-score">' + formatScore(first.score, meta.isTime) + '</div>' +
      '</div>';
    } else {
      podiumHtml += '<div class="podium-card first" style="opacity:0.3;"><div class="podium-medal">🥇</div><div class="podium-team">-</div></div>';
    }

    if (third) {
      podiumHtml += '<div class="podium-card third">' +
        '<div class="podium-medal">🥉</div>' +
        '<div class="podium-team">' + third.team + '</div>' +
        '<div class="podium-sabun">' + maskSabun(third.sabun) + '</div>' +
        '<div class="podium-score">' + formatScore(third.score, meta.isTime) + '</div>' +
      '</div>';
    } else {
      podiumHtml += '<div class="podium-card third" style="opacity:0.3;"><div class="podium-medal">🥉</div><div class="podium-team">-</div></div>';
    }

    podiumArea.innerHTML = podiumHtml;

    var restList = list.slice(3, 10);
    var listHtml = "";
    restList.forEach(function(item, idx){
      var rank = idx + 4;
      listHtml += '<div class="rank-row">' +
        '<div class="rank-row-left">' +
          '<span class="rank-num">' + rank + '</span>' +
          '<div>' +
            '<span class="rank-team">' + item.team + '</span> ' +
            '<span class="rank-sabun">(' + maskSabun(item.sabun) + ')</span>' +
          '</div>' +
        '</div>' +
        '<span class="rank-val">' + formatScore(item.score, meta.isTime) + '</span>' +
      '</div>';
    });

    rankListArea.innerHTML = listHtml;
  }

  function renderTeamRank(){
    var list = cachedData.teams || [];
    if (list.length === 0) {
      teamListArea.innerHTML = "";
      emptyState.style.display = "block";
      emptyMsg.textContent = "팀별 참여 기록을 집계 중입니다.";
      return;
    }
    emptyState.style.display = "none";

    var html = "";
    list.forEach(function(item, idx){
      var rank = idx + 1;
      var rankClass = rank <= 3 ? ("rank-" + rank) : "";
      var medal = rank === 1 ? "🥇 " : (rank === 2 ? "🥈 " : (rank === 3 ? "🥉 " : ""));

      html += '<div class="team-card ' + rankClass + '">' +
        '<div class="team-left">' +
          '<div class="team-badge">' + rank + '</div>' +
          '<div class="team-info">' +
            '<div class="team-title">' + medal + item.team + '</div>' +
            '<div class="team-sub">TOP 10 진입: ' + item.topRankCount + '회</div>' +
          '</div>' +
        '</div>' +
        '<div class="team-score-box">' +
          '<div class="team-score">' + item.totalPoints + ' pts</div>' +
          '<div class="team-score-lbl">종합 승점</div>' +
        '</div>' +
      '</div>';
    });

    teamListArea.innerHTML = html;
  }

  function fetchRankings(){
    if (!GOOGLE_WEBHOOK_URL) return;

    fetch(GOOGLE_WEBHOOK_URL, { method: "GET" })
      .then(function(res){ return res.json(); })
      .then(function(data){
        if (data && data.status === "success") {
          cachedData = data;
          render();
        }
      })
      .catch(function(err){
        console.warn("랭킹 패치 에러:", err);
      });
  }

  function startAutoRefresh(){
    clearInterval(countdownTimer);
    countdown = REFRESH_INTERVAL;
    countdownTimer = setInterval(function(){
      countdown--;
      countdownText.textContent = countdown + "초 후 갱신";
      if (countdown <= 0) {
        countdown = REFRESH_INTERVAL;
        fetchRankings();
      }
    }, 1000);
  }

  btnManualRefresh.addEventListener("click", function(){
    btnManualRefresh.textContent = "갱신 중...";
    fetchRankings();
    setTimeout(function(){
      btnManualRefresh.textContent = "새로고침";
      countdown = REFRESH_INTERVAL;
    }, 600);
  });

  render();
  fetchRankings();
  startAutoRefresh();
})();
</script>
</body>
</html>
